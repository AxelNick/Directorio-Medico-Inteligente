services:
  - type: web
    name: directorio-medico-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /salud
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_UPLOADS_SUPABASE_URL
        sync: false
      - key: APP_UPLOADS_SUPABASE_BUCKET
        value: fotos-medicos
      - key: APP_UPLOADS_SUPABASE_KEY
        sync: false
