# Configuración de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/directorio_medico
spring.datasource.username=usuario_medico
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Flyway para migraciones automáticas
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Fotografías de perfil del médico (US-MED-02)
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Render asigna el puerto al iniciar el servicio; localmente se conserva 8080.
server.port=${PORT:8080}
# Lista exacta de orígenes del frontend, separada por comas.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
