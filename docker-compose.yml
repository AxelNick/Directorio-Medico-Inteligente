services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: usuario_medico
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: directorio_medico
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_medico -d directorio_medico"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Sobrescribe application.properties: dentro de la red de compose la BD se llama "db"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/directorio_medico
      SPRING_DATASOURCE_USERNAME: usuario_medico
      SPRING_DATASOURCE_PASSWORD: password123
      APP_UPLOADS_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
