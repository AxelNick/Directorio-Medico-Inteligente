services:
  db:
    ports: !reset []
    cpus: 0.5
    mem_limit: 384m
    environment:
      POSTGRES_PASSWORD: ${DMI_DB_PASSWORD:?Se requiere la clave de la base de ensayo}
  backend:
    cpus: 1
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_PASSWORD: ${DMI_DB_PASSWORD:?Se requiere la clave de la base de ensayo}
      JWT_SECRET: ${JWT_SECRET:?Se requiere el secreto JWT}
      APP_ADMIN_BOOTSTRAP_USERNAME: ${APP_ADMIN_BOOTSTRAP_USERNAME:-}
      APP_ADMIN_BOOTSTRAP_PASSWORD: ${APP_ADMIN_BOOTSTRAP_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:15173}
      APP_TRIAGE_PROVIDER: simulado
  frontend:
    cpus: 0.25
    mem_limit: 128m
